name: CI

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  merge-policy:
    name: merge-policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require owner approval for external pull requests
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          OWNER_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'owner-approved') }}
        run: |
          if [ "$AUTHOR_ASSOCIATION" = "OWNER" ] || [ "$OWNER_APPROVED" = "true" ]; then
            echo "Merge policy satisfied."
            exit 0
          fi

          echo "External pull requests require the owner-approved label before merging."
          exit 1

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up project Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.7.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Test offline suite
        run: pnpm run test:offline

      - name: Build
        run: pnpm run build

      - name: Pack
        run: |
          mkdir -p .local/pack
          pnpm pack --pack-destination .local/pack

  node-22-compatibility:
    name: node-22-compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.19.0

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.7.0
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify minimum supported Node.js
        run: |
          pnpm run typecheck
          pnpm run test
          pnpm run build
